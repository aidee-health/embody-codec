version: 2
updates:
  - package-ecosystem: github-actions
    # "/" only covers .github/workflows/**. The repo's own composite actions live in
    # .github/actions/<name>/action.yml and need their own directory entries, otherwise
    # their `uses:` pins silently go stale.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github_actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
