name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      # setup-uv stopped publishing floating major tags at v8 (supply-chain hardening),
      # so this must be pinned to a full immutable tag — "@v9" does not resolve.
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock" # invalidate cache if uv.lock changes
        # v9 flipped the `prune-cache` default to false. This project's dependency
        # tree is tiny, so pruning costs more than it saves — keep the v9 default,
        # stated explicitly so the behaviour is not an accident of the version bump.
        prune-cache: false

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
